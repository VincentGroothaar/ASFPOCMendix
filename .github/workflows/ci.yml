name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    # Throwaway Postgres for this job only; the values are not secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cockpit
          POSTGRES_PASSWORD: cockpit
          POSTGRES_DB: cockpit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cockpit -d cockpit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cockpit:cockpit@localhost:5432/cockpit

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Django system check
        run: uv run python manage.py check

      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest
